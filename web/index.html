<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Friends Slay the Dragon</title>
    <link rel="icon" type="image/jpeg" href="public/icons/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { height: 100%; }
      body {
        background: #080818;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        height: 100dvh; /* mobile browsers: excludes collapsible chrome */
        display: flex;
        align-items: center;
        justify-content: center;
        overscroll-behavior: none; /* prevent pull-to-refresh */
        touch-action: none;        /* let Phaser own all touch events */
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()))
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
